.card{width:150px;background:var(--card);border:3px solid;border-radius:12px;padding:8px;animation:pop .35s both}

.badge{display:inline-block;padding:1px 6px;border-radius:8px;color:#fff;font-size:11px;margin:1px;text-shadow:0 1px 2px #0008}
@keyframes rb{to{background-position:200% 0}}
.rb{background:linear-gradient(90deg,#f33,#fa3,#ee3,#3d5,#3af,#93f,#f3a,#f33);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rb 3s linear infinite}

#hud{display:none;position:absolute;inset:0;pointer-events:none}canvas#c{display:none;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hi{position:absolute;top:8px;left:8px;background:#000a;padding:6px 10px;border-radius:8px;min-width:150px}
.bar{height:10px;background:#0008;border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:#4c4;width:100%}
#rm{position:absolute;top:8px;right:8px;background:#000a;padding:6px;border-radius:8px;text-align:right}
#joy{position:absolute;left:0;bottom:0;width:50%;height:60%;pointer-events:auto;touch-action:none}
#jb{position:absolute;width:100px;height:100px;border-radius:50%;border:3px solid #fff5;background:#fff1;display:none;margin:-50px 0 0 -50px}
#jk{position:absolute;left:28px;top:28px;width:44px;height:44px;border-radius:50%;background:#fff8}
#atk{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,76px);gap:8px}
@media(max-width:700px){.ab{width:64px;height:56px;font-size:10px}#atk{grid-template-columns:repeat(3,64px)}}
@media(min-width:701px){#atk{right:auto;left:50%;transform:translateX(-50%);display:flex}}
.ab{position:relative;width:76px;height:64px;overflow:hidden;pointer-events:auto;touch-action:none;font-size:11px;padding:2px;margin:0}
.ab i{position:absolute;left:0;right:0;bottom:0;background:#000b;height:calc(var(--cd,0)*100%)}.ab span{position:relative}
